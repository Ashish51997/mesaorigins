name: mesaorigins

x-database-environment: &database-environment
  DATABASE_URL: postgresql://app_user:app_user@postgres:5432/${MESAORIGINS_POSTGRES_DB:-masspolimer}?schema=public
  DIRECT_DATABASE_URL: postgresql://${MESAORIGINS_POSTGRES_USER:-masspolimer}:${MESAORIGINS_POSTGRES_PASSWORD:-masspolimer}@postgres:5432/${MESAORIGINS_POSTGRES_DB:-masspolimer}?schema=public

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MESAORIGINS_POSTGRES_USER:-masspolimer}
      POSTGRES_PASSWORD: ${MESAORIGINS_POSTGRES_PASSWORD:-masspolimer}
      POSTGRES_DB: ${MESAORIGINS_POSTGRES_DB:-masspolimer}
    ports:
      - "${MESAORIGINS_POSTGRES_PORT:-5432}:5432"
    volumes:
      - masspolimer-pgdata:/var/lib/postgresql/data
      # Creates the least-privilege app_user role before Prisma creates tables.
      - ./server/prisma/setup-roles.sql:/docker-entrypoint-initdb.d/10-setup-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MESAORIGINS_POSTGRES_USER:-masspolimer} -d ${MESAORIGINS_POSTGRES_DB:-masspolimer}"]
      interval: 5s
      timeout: 5s
      retries: 12
    stop_grace_period: 30s

  migrate:
    image: mesaorigins-migration:local
    build:
      context: .
      target: migration
    restart: "no"
    environment:
      <<: *database-environment
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npm", "run", "release:migrate"]

  app:
    image: mesaorigins-app:local
    build:
      context: .
      target: production
    restart: unless-stopped
    init: true
    environment:
      <<: *database-environment
      NODE_ENV: production
      PORT: 3000
      # Production-mode startup is fail-closed. These predictable values are
      # local Compose defaults only; shared deployments use Secret Manager.
      APP_URL: ${MESAORIGINS_APP_URL:-https://localhost:${MESAORIGINS_APP_PORT:-4000}}
      AUTH_URL: ${MESAORIGINS_APP_URL:-https://localhost:${MESAORIGINS_APP_PORT:-4000}}
      DEV_AUTH: ${MESAORIGINS_DEV_AUTH:-0}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      AUTH_SECRET: ${AUTH_SECRET:-local-compose-auth-secret-change-before-sharing}
      SEED_USER_PASSWORD: ${MESAORIGINS_SEED_PASSWORD:-mesaorigins123}
      MESAORIGINS_VENDOR_BANK_ENCRYPTION_KEY: ${MESAORIGINS_VENDOR_BANK_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      MESAORIGINS_ERP_OPS_HANDOFF_HMAC_KEY: ${MESAORIGINS_ERP_OPS_HANDOFF_HMAC_KEY:-AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=}
      MESAORIGINS_OPS_STATUTORY_EVIDENCE_HMAC_KEY: ${MESAORIGINS_OPS_STATUTORY_EVIDENCE_HMAC_KEY:-AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgI=}
      MESAERP_EXTERNAL_EVIDENCE_HMAC_KEY: ${MESAERP_EXTERNAL_EVIDENCE_HMAC_KEY:-AwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwM=}
    ports:
      - "${MESAORIGINS_APP_PORT:-4000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6
    stop_grace_period: 15s

  # Explicit because the current seed truncates and recreates all demo data.
  # Run with: docker compose --profile tools run --rm seed
  seed:
    profiles: ["tools"]
    image: mesaorigins-migration:local
    build:
      context: .
      target: migration
    environment:
      <<: *database-environment
      SEED_USER_PASSWORD: ${MESAORIGINS_SEED_PASSWORD:-mesaorigins123}
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["npm", "run", "db:seed"]

volumes:
  masspolimer-pgdata:
